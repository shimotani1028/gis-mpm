name: Numerical validation foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run --silent benchmark:cpu > cpu-diagnostics.json
      - run: npm run build
      # Hosted CI has no guaranteed physical WebGPU adapter. GPU tests remain
      # explicit manual evidence; CPU success must not be reported as GPU pass.
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-analytic-diagnostics
          path: cpu-diagnostics.json
